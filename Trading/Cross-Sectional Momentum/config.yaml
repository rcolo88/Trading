# Cross-Sectional Residual Momentum — Strategy Config
# All date/numeric parameters are exposed here; no magic numbers in code.

universe:
  index: combined_sp            # sp500 | sp400 | sp600 | combined_sp
  min_pit_history_days: 126     # require a name to have been in index ≥ 6 months before using it

data:
  # ── DATE RANGE ──────────────────────────────────────────────────────
  # start_date controls the ANALYSIS window (IS + OOS split).
  # The cache always stores data from 2010 onward for warmup headroom,
  # so changing start_date never requires re-running "fetch".
  # With a 70/30 walk-forward split, OOS ≈ the last 30% of this range:
  #   start 2015 → OOS covers roughly 2022–2026 (recent dynamics)
  #   start 2010 → OOS covers roughly 2018–2026 (longer historical view)
  start_date: "2015-01-01"   # FIXED, far-back analysis anchor (keep it long: the
                             #   signal burns ~2×window≈504 days of warmup INSIDE the
                             #   window, and long history spans more regimes → honest
                             #   OOS). "auto"/blank → cache floor (2010). Reproducible.
  end_date: auto             # AUTO-ANCHORED by _backtest_window(): today − barrier_window
                             #   (~42 trading days), so the backtest always tracks fresh
                             #   data yet never evaluates on the last ~2 months where
                             #   triple-barrier labels can't resolve. Set a literal date
                             #   to pin a reproducible end (still clamped to that ceiling).
                             #   `fetch`/`ideas` ignore this and price off today's close.
  # `ideas` is fully decoupled from start_date/end_date above: it scores only the
  # latest row, so its window start is pure signal WARMUP measured back from today.
  # The residual-momentum signal stacks two 252-day windows (~504 trading days ≈ 24
  # months minimum); 30 months adds a cushion for halts/NaN gaps. Raise if you see
  # names dropping out for "stale"/insufficient-history reasons.
  ideas_warmup_months: 30
  cache_dir: "outputs/cache"

signal:
  type: composite               # residual | naive | composite (resid-mom + FIP
                                #   continuity + 52wk-high proximity, equal-weight z).
                                #   2026-07-16 sweep: composite OOS Sharpe 1.33 vs
                                #   residual 1.17, same MaxDD — the only variant of 7
                                #   that cleared the +0.1 bar (see validation.trial_sharpes).
  window: 252                   # momentum lookback (trading days, ≈12 months)
  skip: 21                      # skip recent bars (trading days, ≈1 month reversal filter)
  quantile: 0.80                # top-quantile threshold for long selection (0.80 = top quintile)
  max_beta:                     # exclude candidates with rolling 252d CAPM beta above
                                #   this (e.g. 1.3) from the eligible pool before ranking.
                                #   null = off. Pre-registered Track-A test: rolling
                                #   portfolio beta swings 0.24-1.55 across 2017-2026.

regime_filter:
  enabled: true
  mode: binary                  # binary = legacy 0/1 gate (off only when SPY < MA AND
                                #   vol high). graded = 0/½/1 exposure from three
                                #   conditions: SPY>MA, vol<cap, VIX<VIX3M (term
                                #   structure catches acute vol shocks the MA lags).
                                #   robust = MIN(turbulence/absorption-ratio, slow-bleed)
                                #   — 2026-08-04 regime-robustness project. Validated on
                                #   real 2000-2026 data: beats SPY buy-hold on Sharpe/MaxDD/
                                #   worst-rolling-window, no catastrophic loss in ANY tested
                                #   crisis (GFC/COVID/2011/2022/dotcom). NOT YET made the
                                #   default — needs a Phase-4 head-to-head on the SAME
                                #   equity-book harness before flipping live. See memory
                                #   csm-regime-robustness-project. Requires `fetch` to have
                                #   downloaded the 7-asset regime panel (SPY/EFA/EEM/AGG/
                                #   TLT/RWR/GLD) — falls back to full exposure if missing.
  spy_ma_days: 200              # SPY must be above its N-day MA to take new longs
                                #   (binary/graded modes only — robust mode ignores this)
  vol_cap: 0.25                 # annualised SPY vol above which exposure is reduced
                                #   (binary/graded modes only)
  defensive: none               # none = uninvested capital sits in cash.
                                #   IEF = park it in 7-10y Treasuries instead (the
                                #   sleeve is engine-held but never signal-selected).
                                #   rotation = multi-asset absolute-momentum rotation among
                                #   IEF/TLT/GLD/DBC/DBMF/BTAL (csm/multiasset.py), top
                                #   `portfolio.rotation_top_n` positive-momentum names,
                                #   else SHY. Validated fix for 2022 (static IEF-only lost
                                #   -15.2% that year; rotation made +10.4%). Pairs naturally
                                #   with mode: robust but works with any mode.

vol_scaling:
  enabled: true
  target_vol: 0.15              # target annualised portfolio vol (15%)
  estimation_window: 63         # trailing days for realised vol estimate

portfolio:
  rebal_freq: 5                 # rebalance every N trading days (5 = weekly)
  max_names: 25                 # hold the 25 HIGHEST-CONVICTION names of the top
                                #   quintile (ranked by signal). Sweep showed Sharpe
                                #   decays monotonically as the cap grows (the long
                                #   tail of the quintile dilutes the strongest signals
                                #   and worsens drawdowns); ~20-30 is the sweet spot.
  min_names: 10                 # need at least this many longs to trade
  hold_band:                    # hysteresis sell band (rank percentile): buy only from
                                #   the top `quantile`, but HOLD an incumbent until its
                                #   rank falls below this (e.g. 0.60). null = off
                                #   (sell the week a name slips out of the buy set).
  max_per_sector:               # cap names per GICS sector (e.g. 6) — demotes extras
                                #   to the next-best name in another sector, walking
                                #   down the conviction-ranked list. null = off.
                                #   Requires `fetch` to have built the sector cache
                                #   (universe.get_sector_map). Pre-registered Track-A
                                #   test for the 2022 sector-concentration loss.
  weighting: equal              # equal (default, 1/N) | inv_vol (inverse trailing-vol
                                #   weights within the book, same window as vol_scaling
                                #   below). Pre-registered Track-A risk-weighting test.
  rotation_top_n: 2             # defensive rotation slot count (only used when
                                #   regime_filter.defensive: rotation). Validated with 2.

# NOTE: meta-labeling was tested and REMOVED — when re-scored every rebalance (the
# only tradeable way) it underperformed the plain primary book and ~3×'d turnover.
# The strategy now trades the primary residual-momentum book directly.

costs:
  commission_bps: 0              # broker trades long stock commission-free
  half_spread_bps: 5             # one-way half-spread (the real remaining cost)

# 2026-08-05 3-way blend (see memory csm-market-neutral-macro-tests): a
# SEPARATE strategy from the equity cross-sectional momentum engine above —
# SPY (growth proxy) / macro regime tilt / multi-asset rotation, fixed
# weights, monthly rebalanced. Standalone testing (2010-2026) found it beats
# SPY buy-hold on Sharpe with ~half the MaxDD (alpha t~2.0-2.06). Traded via
# the `blend-backtest`/`blend-ideas`/`blend-verify` subcommands, NOT the main
# `backtest`/`ideas` commands. csm/blend.py, csm/macro_regime.py.
#
# 2026-08-05 tuning sweep (6 splits, config's own 2015-2026 window/OOS split):
# OOS Sharpe rose MONOTONICALLY with SPY weight (60/20/20 -> 1.384 best) but
# so did MaxDD/worst-year (60/20/20: MaxDD -12.0%, worst yr -9.4%, close to
# breaching the -10% bar) — this is very likely reward for loading up on
# THIS window's exceptional SPY bull run, the same overfit-to-recent-window
# pattern this project has repeatedly guarded against, NOT genuine skill.
# 40/30/30 (Sharpe 1.316, worst fold 0.41, worst year -4.8%) was chosen
# instead: a modest, defensible improvement over the original equal-ish
# guess that stays roughly consistent with what performed well on the
# LONGER 2010-2026 window tested earlier (unlike 60/20/20, optimal on only
# one window) — consistency across regimes was the original mandate here,
# not maximizing Sharpe on the most recent bull run.
blend:
  growth_ticker: SPYM            # 2026-08-05: switched from SPY on request (lower
                                #   management fee). SPYM = State Street SPDR
                                #   Portfolio S&P 500 ETF, 0.02% expense ratio vs
                                #   SPY's ~0.09%, identical S&P 500 exposure,
                                #   $153B AUM. Verified real trading history back
                                #   to 2010 (not a backfill artifact) before
                                #   adopting, so the backtest needed no changes.
                                #   The benchmark ("SPY buy-and-hold" row in every
                                #   report) always stays literal SPY regardless of
                                #   this setting — this only controls what the
                                #   growth sleeve actually HOLDS.
  weight_spy: 0.40              # growth engine (equity book showed no significant
                                #   differentiation from SPY-beta, so an S&P 500
                                #   tracker is a fair, simpler substitute)
  weight_macro: 0.30            # csm/macro_regime.py sector/asset tilt
  weight_rotation: 0.30         # csm/multiasset.py defensive rotation
  rotation_top_n: 2             # rotation slot count (matches validated setting)
  # 2026-08-05 blend-return-research Phase 1: the macro sleeve was measured at
  # 0.766 daily correlation with the growth sleeve (both are equity, by
  # construction) — these two flags attack that redundancy. See the Phase 1
  # comment block below the trial_sharpes list for the full result and
  # memory csm-market-neutral-macro-tests.
  macro_growth_axis: price       # price (default — KEEP; the "macro" FRED
                                #   axis (NFCI+UNRATE+T10Y2Y point-in-time
                                #   vintage) was tested and found to overfit
                                #   the 2015-2026 window: best OOS Sharpe of
                                #   all 4 variants (1.524) but WORST on the
                                #   2000-2014 holdout (Sharpe 0.586, 2008
                                #   -18.46% — worse than baseline). Rejected.
                                #   CAVEAT (docs/GAPS.md #1, found 2026-08-12,
                                #   fixed same day): that 2000-2014 holdout
                                #   run read a FRED vintage cache with a
                                #   duplicated-row bug spanning 2000-01-31 to
                                #   2002-10-31 (100 vintage-date pairs across
                                #   NFCI/UNRATE/T10Y2Y) that silently halved
                                #   rolling-window computations there — e.g.
                                #   UNRATE's 2002-10-31 vote flipped sign
                                #   (+0.69 buggy vs +0.01 deduped). The cache
                                #   is now deduped and a uniqueness guard is
                                #   in place, but this specific rejection has
                                #   NOT been re-run against the repaired
                                #   cache — treat it as unproven, not settled,
                                #   until it is (task: docs/GAPS.md #1 step 4).
  macro_inflation_axis: price    # price (default — KEEP) | macro — the
                                #   Phase 2.5 (2026-08-12) symmetric override
                                #   for the inflation side (CPIAUCSL +
                                #   PCEPILFE + T10YIE point-in-time vintage,
                                #   csm.macro_regime.inflation_score_macro).
                                #   Built but NOT YET return-tested the way
                                #   macro_growth_axis was — no full-history/
                                #   OOS/2000-2014-holdout pass has run this
                                #   yet. Available as an override; not a
                                #   recommendation. See docs/GAPS.md.
  macro_fx_axis: none            # none (default — KEEP) | carry_unwind —
                                #   GAPS.md #5 framing (a), "the user's yen
                                #   question": a THIRD orthogonal axis
                                #   (csm.macro_regime.fx_stress_axis, DEXJPUS
                                #   sharp appreciation OR DTWEXBGS sharp
                                #   spike) that forces the deflation basket
                                #   on a carry-unwind stress date. Built
                                #   2026-08-12, NOT YET return-tested. See
                                #   risk_overlay: fx below for framing (b),
                                #   the separate standalone-gate hypothesis.
  macro_baskets: v2              # v1 | v2 (REGIME_BASKETS_V2 — majority
                                #   non-equity stagflation/deflation baskets)
                                #   — ADOPTED LIVE 2026-08-05, the one
                                #   surviving finding of a 3-phase
                                #   return-focused pass (see memory
                                #   csm-market-neutral-macro-tests): better on
                                #   every metric in every window tested
                                #   (full-history, OOS, 2000-2014 holdout)
                                #   except one narrow multi-fold miss (0.290
                                #   vs the 0.30 bar), and its DSR (0.945) is
                                #   HIGHER than v1's (0.924) against the same
                                #   40-trial list. Set v1 to revert.
  risk_overlay: none             # none (default — KEEP) | robust | gtt |
                                #   ladder | fx — csm/blend_overlay.py.
                                #   2026-08-05 Phase 2 tested robust/gtt/
                                #   ladder on the Phase 1 base
                                #   (v2 baskets): NONE clears a clean bar —
                                #   each trades one problem for another rather
                                #   than netting a win. robust: best 2015-2026
                                #   full+OOS Sharpe/alpha (t=2.31, a project
                                #   record) but WORST on the 2000-2014 holdout
                                #   (Sharpe 0.465, MaxDD -36.7%) — overfits the
                                #   recent window, the same pattern Phase 1's
                                #   FRED-axis variant showed. gtt: dramatic
                                #   2008 protection (-0.81% vs baseline's
                                #   -13.27%) but WORSE 2015-2026 Sharpe/CAGR/
                                #   alpha with no offsetting MaxDD benefit
                                #   THERE (-16.30%, identical to no-overlay) —
                                #   insurance that doesn't pay for itself
                                #   outside the one crisis it's built for.
                                #   ladder: middling everywhere, worst
                                #   multi-fold result (0.037). All three also
                                #   make 2000-2014's OVERALL MaxDD worse than
                                #   baseline (-35% to -36.7% vs -32.15%) even
                                #   while helping 2008 specifically — de-risks
                                #   at the wrong moment somewhere else in that
                                #   window (dot-com era), the classic static-
                                #   hedge failure mode already seen with SH-
                                #   only crisis hedging (memory
                                #   csm-market-neutral-macro-tests). REJECTED;
                                #   Phase 3 re-levers on the Phase 1 base
                                #   alone, no overlay. fx (2026-08-12,
                                #   GAPS.md #5 framing (b),
                                #   csm.blend_overlay.fx_carry_unwind_exposure)
                                #   and credit_curve (2026-08-12, GAPS.md #6
                                #   Protocol A,
                                #   csm.blend_overlay.credit_curve_risk_off_exposure
                                #   — HY OAS leg can't cover the 2000-2014
                                #   holdout, see its docstring) are separate,
                                #   later additions — built but NOT YET
                                #   return-tested against any of the above.
  # 2026-08-05 Phase 3: re-levered growth weight to 50/55/60% (macro absorbing
  # the reduction, rotation held fixed at 30%) on the Phase 1 base (v2
  # baskets). DECISIVELY REJECTED — the SAME overfit-to-recent-window
  # signature as Phase 1's FRED axis and Phase 2's robust overlay, but
  # cleaner: every re-levered variant's 2015-2026 numbers improve
  # MONOTONICALLY with growth weight (OOS Sharpe 1.472->1.525->1.543->1.555,
  # OOS CAGR 14.6%->15.8%->16.4%->16.9%) while every 2000-2014 HOLDOUT metric
  # gets MONOTONICALLY WORSE (Sharpe 0.656->0.607->0.581->0.554, MaxDD
  # -32.15%->-35.72%->-37.46%->-39.17%, 2008 -13.27%->-17.61%->-19.73%->
  # -21.81%). This is the pre-registered rejection criterion firing exactly
  # as designed: 2015-2026 is a historically exceptional SPY bull run (SPY
  # B&H Sharpe 0.831 there vs 0.305 over 2000-2014), so more growth weight is
  # a bet on that continuing, not a genuine improvement — confirms the
  # original 60/20/20 rejection (above) generalizes even to this
  # de-redundified base. weight_spy/macro/rotation above stay at 40/30/30 —
  # the ONLY change this whole 3-phase pass validates is macro_baskets: v2.
  # OOS Sharpe of every blend-weight configuration tried — same DSR-honesty
